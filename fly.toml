# fly.toml app configuration file generated for parksmart-api on 2026-05-17T16:09:50+10:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'parksmart-api'
primary_region = 'syd'

[build]

[env]
  DB_PATH = '/data/parksmart.db'
  FIXTURES_DIR = 'data_raw/tfnsw_fixtures'

[[mounts]]
  source = 'parksmart_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
